calc:{n:"Calculadora",i:"🧮",w:300,h:420,r(b){
  b.className+=" calc";let e="";
  const k=["C","(",")","/","7","8","9","*","4","5","6","-","1","2","3","+","0",".","⌫","="];
  b.innerHTML='<div class="scr">0</div>'+k.map(x=>`<button class="${"/*-+=".includes(x)?"op":""}">${x}</button>`).join("");
  const s=b.querySelector(".scr");
  b.onclick=ev=>{const x=ev.target.textContent;if(ev.target.tagName!=="BUTTON")return;
    if(x==="C")e="";else if(x==="⌫")e=e.slice(0,-1);
    else if(x==="="){try{if(/^[0-9+\-*/.() ]+$/.test(e))e=String(+Function('"use strict";return ('+e+')')().toFixed(10))}catch(_){e="Erro"}}
    else e=(e==="Erro"?"":e)+x;
    s.textContent=e||"0"};}},
armario:{n:"Armário",i:"📁",w:480,h:340,r(b){
  let p=[];
  const draw=()=>{
    let d=FS;p.forEach(k=>d=d[k]);
    const ents=Object.entries(d);
    b.innerHTML=`<div class="fp"><button ${p.length?"":"disabled"} id="bk">←</button><span>Este computador${p.map(x=>" › "+x).join("")}</span></div><div class="fl">${ents.map(([k,v])=>`<button data-k="${k}"><span>${typeof v==="string"?"📄":"📁"}</span>${k}</button>`).join("")||"<p style='grid-column:1/-1;color:var(--ink2)'>Esta pasta está vazia.</p>"}</div>`;
    b.querySelector("#bk").onclick=()=>{p.pop();draw()};
    b.querySelectorAll("[data-k]").forEach(el=>el.ondblclick=el.onclick=()=>{const v=d[el.dataset.k];if(typeof v==="string")openApp("notas",{text:v});else{p.push(el.dataset.k);draw()}});
  };draw();}},
term:{n:"Terminal",i:"⌨️",w:480,h:300,r(b){
  b.className+=" term";
  b.innerHTML='<div class="out">UniqueOS 1.0 — escreva “ajuda” para ver os comandos.\n</div><div class="ln"><span>unique@os:~$</span><input autocomplete="off" spellcheck="false" aria-label="Comando"></div>';
  const out=b.querySelector(".out"),inp=b.querySelector("input");
  b.onclick=()=>inp.focus();
  const C={ajuda:()=>"ajuda  data  ls  echo  quem  tema claro|escuro|auto  limpar  neofetch",
    data:()=>am(new Date().toLocaleString("pt-PT")),
    ls:()=>Object.keys(FS).join("  "),
    quem:()=>"utilizador",
    neofetch:()=>"  ▟█▙   UniqueOS 1.0\n  ███   Núcleo: HTML + CSS + JS\n  ▜█▛   Janelas abertas: "+Object.keys(wins).length+"\n        Tema: "+S.theme,
    limpar:()=>{out.textContent="";return null},
    tema:a=>{const m={claro:"light",escuro:"dark",auto:"auto"}[a];if(!m)return"Use: tema claro, escuro ou auto";S.theme=m;save();apply();return"Tema alterado."}};
  inp.onkeydown=e=>{if(e.key!=="Enter")return;
    const [c,...a]=inp.value.trim().split(/\s+/);out.textContent+="unique@os:~$ "+inp.value+"\n";
    if(c==="echo")out.textContent+=a.join(" ")+"\n";
    else if(c){const f=C[c];const r=f?f(a[0]):"Comando não encontrado: "+c;if(r!=null)out.textContent+=r+"\n"}
    inp.value="";b.scrollTop=b.scrollHeight};}},
perfil:{n:"Perfil",i:"⚙️",w:400,h:480,r(b){
  b.className+=" pad set";
  const draw0=()=>{b.innerHTML=`<h3>Nome</h3><input class="nm" id="nm" value="${S.name||""}" placeholder="O seu nome" aria-label="Nome"><h3>Tema</h3><div class="row">${[["auto","Sistema"],["light","Claro"],["dark","Escuro"]].map(([v,l])=>`<button data-t="${v}" class="${S.theme===v?"sel":""}">${l}</button>`).join("")}</div><h3>Fundo de ecrã</h3><div class="row">${WP.map((w,i)=>`<button class="sw ${S.wp===i?"sel":""}" data-w="${i}" style="background:${w}" aria-label="Fundo ${i+1}"></button>`).join("")}</div><h3>Cor de destaque</h3><div class="row">${ACC.map(c=>`<button class="dot ${S.acc===c?"sel":""}" data-c="${c}" style="background:${c}" aria-label="Cor ${c}"></button>`).join("")}</div><h3>Tamanho do texto</h3><div class="row">${[[13,"Pequeno"],[14,"Normal"],[16,"Grande"]].map(([v,l])=>`<button data-f="${v}" class="${S.fs===v?"sel":""}">${l}</button>`).join("")}</div><h3>Barra de tarefas</h3><div class="row"><button data-k="clear" class="${S.solid?"":"sel"}">Translúcida</button><button data-k="solid" class="${S.solid?"sel":""}">Sólida</button></div><h3>Relógio</h3><div class="row"><button data-k="h12" class="${S.h12?"sel":""}">Formato de 12 horas</button></div><h3>Ambiente de trabalho</h3><div class="row"><button data-k="icons" class="${S.icons?"sel":""}">Mostrar ícones</button></div><h3>Sistema</h3><div class="row"><button data-k="reset">Repor definições</button></div><p style="color:var(--ink2);font-size:12px;margin-top:16px">UniqueOS 1.0</p>`};
  const draw=()=>{if((S.ptab||"g")==="g"){draw0();b.insertAdjacentHTML("beforeend",PX())}else b.innerHTML=PB();b.insertAdjacentHTML("afterbegin",PT())};draw();
  b.addEventListener("click",e=>PC(e,draw));b.addEventListener("change",e=>PG(e,draw));b.addEventListener("input",PI);
  b.oninput=e=>{if(e.target.id==="nm"){S.name=e.target.value;save();apply()}};
  b.onclick=e=>{const d=e.target.dataset;if(d.t)S.theme=d.t;else if(d.w)S.wp=+d.w;else if(d.c)S.acc=d.c;else if(d.f)S.fs=+d.f;else if(d.k==="solid")S.solid=true;else if(d.k==="clear")S.solid=false;else if(d.k==="icons")S.icons=!S.icons;else if(d.k==="h12")S.h12=!S.h12;else if(d.k==="reset")S={theme:"auto",wp:0,acc:ACC[0],name:"",inst:[],fs:14,solid:false,icons:true,h12:false};else return;save();apply();draw()};}}
};

function webview(b,url,nav){
  b.style.cssText="display:flex;flex-direction:column;overflow:hidden";
  if(S.wifi===false){b.innerHTML='<div class="gg"><span style="font-size:40px">📡</span><p>Sem ligação à internet. Ative o Wi‑Fi em Perfil.</p></div>';return}
  b.innerHTML=`<div class="ub">${nav?'<button id="hm" aria-label="Início">🏠</button>':""}<input id="u" aria-label="Endereço" placeholder="Pesquise ou escreva um endereço" ${nav?"":"readonly"}><button id="ex" aria-label="Abrir em novo separador" title="Abrir em novo separador">↗</button></div><div class="wf"></div>`;
  const wf=b.querySelector(".wf"),u=b.querySelector("#u");
  const go=x=>{
    let t=x.trim();if(!t)return;
    if(!/^https?:\/\//i.test(t)){if(/\s/.test(t)||!t.includes(".")){window.open("https://www.google.com/search?q="+encodeURIComponent(t),"_blank","noopener");return}t="https://"+t}
    let L;try{L=new URL(t)}catch(_){return}
    u.value=L.href;wf.innerHTML="";
    const f=document.createElement("iframe");f.src=L.href;f.referrerPolicy="no-referrer";f.title=L.hostname;
    f.setAttribute("sandbox","allow-scripts allow-same-origin allow-forms allow-popups allow-modals");
    const h=document.createElement("p");h.className="hint";h.textContent="Se a página não aparecer, o site não permite ser mostrado aqui. Use ↗ para abrir num novo separador.";
    wf.append(f,h)};
  const home=()=>{u.value="";
    wf.innerHTML=`<div class="gg" style="overflow:auto"><img class="im" alt="" src="${ICO.navegador}"><input id="q" placeholder="Pesquisar no Google ou escrever um endereço" aria-label="Pesquisar"><div class="row" style="justify-content:center">${[["Wikipédia","https://pt.wikipedia.org"],["OpenStreetMap","https://www.openstreetmap.org/export/embed.html"],["Excalidraw","https://excalidraw.com"]].map(x=>`<button data-u="${x[1]}">${x[0]}</button>`).join("")}</div></div>`;
    const q=wf.querySelector("#q");q.onkeydown=e=>{if(e.key==="Enter")go(q.value)};
    wf.querySelector(".row").onclick=e=>{const t=e.target.dataset.u;if(t)go(t)}};
  u.onkeydown=e=>{if(e.key==="Enter"&&nav)go(u.value)};
  b.querySelector("#ex").onclick=()=>window.open(u.value||url||"https://www.google.com","_blank","noopener");
  if(nav){b.querySelector("#hm").onclick=home;home()}else go(url);
}

const AU={};
const au=k=>AU[k]||(AU[k]=Object.assign(new Audio(TONES[k].s),{loop:true,preload:"auto"}));
const vol=()=>(S.vol??80)/100;
let ringing=false,vibT=null,prevT=null,lastMin="";
const buzz=()=>{if(S.vib!==false&&navigator.vibrate)navigator.vibrate([600,250,600])};
function stopTone(){Object.values(AU).forEach(a=>{a.pause();a.currentTime=0})}
function prev(k){if(ringing)return;stopTone();const a=au(k);a.volume=vol();a.play().catch(()=>{});buzz();clearTimeout(prevT);prevT=setTimeout(()=>{if(!ringing)stopTone()},2500)}
function ring(title,sub,tone){if(ringing)return;ringing=true;clearTimeout(prevT);stopTone();const a=au(TONES[tone]?tone:"beep");a.volume=vol();a.play().catch(()=>{});buzz();vibT=setInterval(buzz,2000);$("#rgt").textContent=title;$("#rgs").textContent=sub;$("#rg").hidden=false}
function stopRing(){clearInterval(vibT);if(navigator.vibrate)navigator.vibrate(0);stopTone();clearTimeout(prevT);ringing=false;$("#rg").hidden=true;if(wins.alarme&&wins.alarme.set)wins.alarme.set()}
const TM={run:false,end:0,left:0},SWt={run:false,t0:0,acc:0,laps:[]};
const TS=t=>{const[h,m]=t.split(":").map(Number),d=new Date();d.setHours(h,m,0,0);return T(d)};
setInterval(()=>{
  const d=new Date(),hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(hm!==lastMin){lastMin=hm;let hit=null;
    (S.alarms||[]).forEach(a=>{if(a.on&&a.t===hm){hit=hit||a;if(!a.rep)a.on=false}});
    if(hit){save();ring("⏰ Alarme",TS(hit.t),hit.tone);if(wins.alarme&&wins.alarme.set)wins.alarme.set()}}
  if(TM.run&&Date.now()>=TM.end){TM.run=false;TM.left=0;ring("⏳ Timer","O tempo terminou",S.tone||"beep");if(wins.alarme&&wins.alarme.set)wins.alarme.set()}
},1000);

alarme:{n:"Alarme",i:"",w:420,h:470,r(b){
  let tab="a";
  const pad=n=>String(n).padStart(2,"0");
  const fm=ms=>{const t=Math.floor(ms/10);return `${pad(Math.floor(t/6000))}:${pad(Math.floor(t/100)%60)}.${pad(t%100)}`};
  const ft=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`};
  const el=()=>SWt.acc+(SWt.run?Date.now()-SWt.t0:0);
  const tl=()=>TM.run?TM.end-Date.now():TM.left;
  const opts=v=>Object.entries(TONES).map(([k,t])=>`<option value="${k}"${v===k?" selected":""}>${t.n}</option>`).join("");
  const draw=()=>{
    const tabs='<div class="row tabs">'+[["a","Alarmes"],["c","Cronômetro"],["t","Timer"]].map(([k,l])=>`<button data-tab="${k}" class="${tab===k?"sel":""}">${l}</button>`).join("")+"</div>";
    let h="";
    if(tab==="a"){const L=S.alarms||[];
      h=`<div class="al"><input type="time" id="nt" value="07:00" aria-label="Hora"><select id="ntn" aria-label="Toque">${opts(S.tone||"beep")}</select><label class="tg"><span>Repetir todos os dias</span><input type="checkbox" id="nr"></label><button id="add">Adicionar</button></div>`+
        (L.length?L.map(a=>`<div class="st"><div><b style="font-size:20px">${TS(a.t)}</b><br><small>${TONES[a.tone]?TONES[a.tone].n:"Beep"}${a.rep?" · todos os dias":""}</small></div><input type="checkbox" data-on="${a.id}" ${a.on?"checked":""} aria-label="Ativo"><button class="ok" data-del="${a.id}">Apagar</button></div>`).join(""):'<p class="hint">Sem alarmes. Adicione um acima.</p>')}
    else if(tab==="c"){
      h=`<div class="big2" id="swd">${fm(el())}</div><div class="row c"><button id="sgo">${SWt.run?"Pausar":"Iniciar"}</button><button id="slap">Volta</button><button id="srs">Repor</button></div>`+SWt.laps.map((l,i)=>`<div class="st"><span>#${SWt.laps.length-i}</span><div>${fm(l)}</div></div>`).join("")}
    else{const idle=!TM.run&&!TM.left;
      h=`<div class="big2" id="tmd">${ft(tl())}</div>`+(idle?'<div class="tin"><input type="number" id="th" min="0" max="99" value="0" aria-label="Horas"><b>h</b><input type="number" id="tm2" min="0" max="59" value="5" aria-label="Minutos"><b>min</b><input type="number" id="ts" min="0" max="59" value="0" aria-label="Segundos"><b>s</b></div>':"")+
        `<div class="row c"><button id="tgo">${TM.run?"Pausar":(TM.left?"Continuar":"Iniciar")}</button><button id="trs">Repor</button></div><div class="row c" style="margin-top:12px"><select id="ttn" aria-label="Toque do timer">${opts(S.tone||"beep")}</select></div><div class="row c" style="margin-top:16px"><button id="stp" class="red">Parar</button></div>`}
    b.innerHTML=tabs+h};
  b.onclick=e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset,i=t.id;
    if(d.tab){tab=d.tab;draw();return}
    if(i==="add"){const v=b.querySelector("#nt").value;if(!v)return;(S.alarms=S.alarms||[]).push({id:Date.now().toString(36),t:v,on:true,tone:b.querySelector("#ntn").value,rep:b.querySelector("#nr").checked});save()}
    else if(d.del){S.alarms=(S.alarms||[]).filter(a=>a.id!==d.del);save()}
    else if(i==="sgo"){if(SWt.run){SWt.acc+=Date.now()-SWt.t0;SWt.run=false}else{SWt.t0=Date.now();SWt.run=true}}
    else if(i==="slap"){if(SWt.run||SWt.acc)SWt.laps.unshift(el())}
    else if(i==="srs"){SWt.run=false;SWt.acc=0;SWt.laps=[]}
    else if(i==="tgo"){if(TM.run){TM.left=TM.end-Date.now();TM.run=false}else{if(!TM.left){const g=s=>+(b.querySelector(s)||{value:0}).value||0;TM.left=((g("#th")*60+g("#tm2"))*60+g("#ts"))*1000}if(!TM.left)return;TM.end=Date.now()+TM.left;TM.run=true}}
    else if(i==="trs"){TM.run=false;TM.left=0}
    else if(i==="stp"){if(ringing){stopRing();return}TM.run=false;TM.left=0}
    else return;
    draw()};
  b.onchange=e=>{const t=e.target;
    if(t.dataset.on){const a=(S.alarms||[]).find(x=>x.id===t.dataset.on);if(a){a.on=t.checked;save()}}
    else if(t.id==="ttn"){S.tone=t.value;save();prev(t.value)}};
  const iv=setInterval(()=>{const s=b.querySelector("#swd");if(s)s.textContent=fm(el());const x=b.querySelector("#tmd");if(x)x.textContent=ft(tl())},100);
  draw();
  return{set:draw,off:()=>clearInterval(iv)};}},
clima:{n:"Clima",i:"",w:420,h:500,r(b){
  const WC=c=>c===0?["☀️","Céu limpo"]:c<=2?["🌤️","Pouco nublado"]:c===3?["☁️","Nublado"]:c<=48?["🌫️","Nevoeiro"]:c<=57?["🌦️","Chuvisco"]:c<=67?["🌧️","Chuva"]:c<=77?["❄️","Neve"]:c<=82?["🌧️","Aguaceiros"]:c<=86?["🌨️","Neve fraca"]:["⛈️","Trovoada"];
  const AQ=v=>v<=20?["Boa","#2f9e5b"]:v<=40?["Razoável","#7cb342"]:v<=60?["Moderada","#d4a017"]:v<=80?["Fraca","#f08a4b"]:v<=100?["Muito fraca","#e5384f"]:["Extremamente fraca","#8a1c4a"];
  const J=u=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.json()});
  const day=i=>{const d=new Date();d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)};
  const DW={current:{temperature_2m:22,apparent_temperature:21,relative_humidity_2m:58,weather_code:1,wind_speed_10m:12},daily:{time:[0,1,2,3,4].map(day),weather_code:[1,2,3,61,0],temperature_2m_max:[24,23,21,19,25],temperature_2m_min:[14,14,13,12,15]}};
  const DA={current:{european_aqi:38,pm2_5:9,pm10:16}};
  let city=S.city||{n:"Lisboa",lat:38.72,lon:-9.14};
  const out=()=>b.querySelector("#out");
  const view=(w,a,demo)=>{
    const c=w.current,ic=WC(c.weather_code),q=Math.round(a.current.european_aqi),aq=AQ(q);
    out().innerHTML=`<div class="wcl"><div class="ct">${ic[0]} ${Math.round(c.temperature_2m)}°C</div><div>${esc(city.n)} · ${ic[1]}</div><small>Sensação ${Math.round(c.apparent_temperature)}°C · Humidade ${c.relative_humidity_2m}% · Vento ${Math.round(c.wind_speed_10m)} km/h</small></div><div class="aq"><div><b>Qualidade do ar</b><br><small>PM2.5 ${a.current.pm2_5} · PM10 ${a.current.pm10} µg/m³</small></div><div class="qb" style="background:${aq[1]}">${q}<small>${aq[0]}</small></div></div><div class="dy">${w.daily.time.map((t,i)=>`<div><small>${new Date(t+"T12:00").toLocaleDateString("pt-PT",{weekday:"short"})}</small><span>${WC(w.daily.weather_code[i])[0]}</span><b>${Math.round(w.daily.temperature_2m_max[i])}°</b><small>${Math.round(w.daily.temperature_2m_min[i])}°</small></div>`).join("")}</div>${demo?'<p class="hint">Dados de exemplo: sem ligação aos dados em direto.</p>':'<p class="hint">Qualidade do ar: índice europeu (0 = ótima, mais alto = pior).</p>'}`};
  const load=async()=>{out().textContent="A carregar…";
    try{if(S.wifi===false)throw 1;
      const [w,a]=await Promise.all([J(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`),J(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${city.lat}&longitude=${city.lon}&current=european_aqi,pm2_5,pm10`)]);
      view(w,a,false)}catch(e){view(DW,DA,true)}};
  b.innerHTML='<div class="ub"><input id="cq" placeholder="Pesquisar cidade" aria-label="Cidade"><button id="cgo">Pesquisar</button><button id="cgp" aria-label="Usar a minha localização" title="Usar a minha localização">📍</button></div><div id="out" class="pad"></div>';
  const find=async()=>{const q=b.querySelector("#cq").value.trim();if(!q)return;
    try{const r=await J("https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&name="+encodeURIComponent(q));const x=r.results&&r.results[0];
      if(!x){out().textContent="Cidade não encontrada.";return}
      city={n:x.name,lat:x.latitude,lon:x.longitude};S.city=city;save();load()}catch(e){out().textContent="Não foi possível pesquisar (sem ligação)."}};
  b.querySelector("#cgo").onclick=find;b.querySelector("#cq").onkeydown=e=>{if(e.key==="Enter")find()};
  b.querySelector("#cgp").onclick=()=>{if(!navigator.geolocation){out().textContent="Localização não suportada.";return}
    navigator.geolocation.getCurrentPosition(p=>{city={n:"A minha localização",lat:p.coords.latitude,lon:p.coords.longitude};S.city=city;save();load()},()=>{out().textContent="Localização indisponível."})};
  load();}}

const hash=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("uos:"+s)))].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"p:"+s}};
function dots(){document.querySelectorAll(".pin .dots i").forEach((d,i)=>d.classList.toggle("on",i<pinv.length))}
function lockReset(){pinv="";$("#lock").classList.remove("pn");$(".pin").hidden=true;dots()}
function unlock(){$("#lock").classList.add("off");lockReset()}
async function pinKey(k){
  if(k==="⌫")pinv=pinv.slice(0,-1);else if(pinv.length<4)pinv+=k;
  dots();
  if(pinv.length===4){
    if((await hash(pinv))===S.pin)unlock();
    else{$(".pin .pm").textContent="PIN incorreto";$(".pin").classList.add("shake");setTimeout(()=>{$(".pin").classList.remove("shake");pinv="";dots()},450)}}}
const PT=()=>'<div class="row tabs">'+[["g","Geral"],["b","Bloqueio"]].map(([k,l])=>`<button data-q="ptab" data-v="${k}" class="${(S.ptab||"g")===k?"sel":""}">${k==="b"?`<img class="tbi" alt="" src="${ICO.pin}"> `:""}${l}</button>`).join("")+"</div>";
const PB=()=>`<h3>Bloqueio por PIN</h3><div class="pinh"><img class="im" alt="" src="${ICO.pin}"><p>${S.pin?"O PIN está ativo e será pedido ao desbloquear o ecrã.":"Defina um PIN de 4 dígitos para proteger o ecrã de bloqueio."}</p></div><div class="pn"><input class="nm" id="p1" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="${S.pin?"Novo PIN":"PIN (4 dígitos)"}" aria-label="PIN"><input class="nm" id="p2" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Repetir PIN" aria-label="Repetir PIN"></div><div class="row" style="margin-top:10px"><button data-q="pin" data-v="save">Guardar PIN</button>${S.pin?'<button data-q="pin" data-v="del">Remover PIN</button>':""}</div><p id="pmsg" class="hint" style="background:none"></p>`;
async function pinAct(v,t,draw){
  const r=t.closest(".bd"),p1=r.querySelector("#p1"),p2=r.querySelector("#p2");let m="";
  if(v==="del"){delete S.pin;save();m="PIN removido."}
  else if(!/^\d{4}$/.test(p1.value))m="O PIN deve ter exatamente 4 dígitos."
  else if(p1.value!==p2.value)m="Os PINs não coincidem."
  else{S.pin=await hash(p1.value);save();m="PIN guardado. Será pedido ao desbloquear."}
  draw();const x=r.querySelector("#pmsg");if(x)x.textContent=m}

function openApp(id,o={}){
  hideStart();let w=wins[id];
  if(w){w.el.classList.remove("min");focus(id);if(o.text!=null&&w.set)w.set(o.text);return}
  const a=apps[id],el=document.createElement("div"),n=Object.keys(wins).length;
  el.className="win";
  el.style.cssText=`left:${Math.min(70+n*30,Math.max(0,SW()-a.w-10))}px;top:${Math.min(30+n*30,Math.max(0,SH()-a.h-60))}px;width:${Math.min(a.w,SW()-20)}px;height:${Math.min(a.h,SH()-60)}px`;
  el.innerHTML=`<div class="tb">${I(a)}<b>${a.n}</b><i></i><button data-a="min" aria-label="Minimizar"><img alt="" src="${UI.min}"></button><button data-a="max" aria-label="Maximizar"><img alt="" src="${UI.max}"></button><button data-a="x" class="cl" aria-label="Fechar"><img alt="" src="${UI.x}"></button></div><div class="bd"></div>`;
  $("#desk").append(el);
  w=wins[id]={el};
  const api=a.r(el.querySelector(".bd"),o);if(api){w.set=api.set;w.off=api.off}
  if(SW()<700)el.classList.add("max");
  el.addEventListener("pointerdown",()=>focus(id));
  el.querySelector(".tb").addEventListener("click",e=>{const x=e.target.dataset.a;if(!x)return;
    if(x==="x"){if(w.off)w.off();el.remove();delete wins[id];if(cur===id)cur=null;tbar()}
    else if(x==="min"){el.classList.add("min");cur=null;tbar()}
    else el.classList.toggle("max")});
  el.querySelector(".tb").addEventListener("dblclick",e=>{if(!e.target.dataset.a)el.classList.toggle("max")});
  el.querySelector(".tb").addEventListener("pointerdown",e=>{
    if(e.target.dataset.a||el.classList.contains("max"))return;
    const q=P(e),dx=q.x-el.offsetLeft,dy=q.y-el.offsetTop;
    const mv=m=>{const p=P(m);el.style.left=Math.min(Math.max(p.x-dx,-el.offsetWidth+80),SW()-80)+"px";el.style.top=Math.min(Math.max(p.y-dy,0),SH()-96)+"px"};
    const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up)};
    addEventListener("pointermove",mv);addEventListener("pointerup",up)});
  focus(id);
}
function focus(id){const w=wins[id];if(!w)return;cur=id;w.el.style.zIndex=++z;tbar()}
function tbar(){
  Object.entries(wins).forEach(([k,w])=>w.el.classList.toggle("on",k===cur&&!w.el.classList.contains("min")));
  $("#mid").innerHTML='<button class="ti" id="sb" aria-label="Menu Iniciar"><img class="im" alt="" src="'+UI.start+'"></button>'+Object.entries(apps).filter(([k])=>!k.startsWith("w_")||wins[k]).map(([k,a])=>`<button class="ti ${wins[k]?"run":""} ${k===cur&&wins[k]&&!wins[k].el.classList.contains("min")?"act":""}" data-id="${k}" title="${a.n}" aria-label="${a.n}">${I(a)}</button>`).join("");
}
$("#mid").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="sq"){const s=$("#start");s.hidden=false;$("#q").value="";grid();$("#q").focus();return}if(b.id==="sb"){const s=$("#start");s.hidden=!s.hidden;if(!s.hidden){$("#q").value="";grid();$("#q").focus()}return}
  const id=b.dataset.id,w=wins[id];
  if(!w)openApp(id);
  else if(w.el.classList.contains("min")||cur!==id){w.el.classList.remove("min");focus(id)}
  else{w.el.classList.add("min");cur=null;tbar()}

});
function hideStart(){$("#start").hidden=true;$("#qs").hidden=true}
function grid(){
  const q=$("#q").value.toLowerCase();
  $("#grid").innerHTML=Object.entries(apps).filter(([k,a])=>a.n.toLowerCase().includes(q)).map(([k,a])=>`<button data-id="${k}"><span>${I(a)}</span>${a.n}</button>`).join("")||"<p style='grid-column:1/-1;color:var(--ink2)'>Nenhuma aplicação encontrada.</p>";
}
$("#q").oninput=grid;
$("#grid").onclick=e=>{const b=e.target.closest("[data-id]");if(b)openApp(b.dataset.id)};
$("#lk").onclick=()=>{hideStart();$("#lock").classList.remove("off");lockReset()};
$("#lock").onclick=e=>{if(e.target.closest(".pin"))return;if(S.pin){$("#lock").classList.add("pn");$(".pin").hidden=false;pinv="";dots();$(".pin .pm").textContent="Introduza o PIN"}else unlock()};
$("#desk").addEventListener("pointerdown",e=>{if(e.target.id==="desk")hideStart()});

const GW=75,GH=75,GX=0,GY=0;
const gcols=()=>Math.max(1,Math.floor((SW()-GX*2)/GW)),grows=()=>Math.max(1,Math.floor((SH()-48-GY*2)/GH));
const DK=()=>{if(!S.dk){const rs=grows();S.dk=Object.keys(apps).filter(k=>!k.startsWith("w_")).map((id,i)=>({id,c:Math.floor(i/rs),r:i%rs}));save()}return S.dk};
const overTrash=p=>p.x>=SW()-78-16&&p.x<=SW()-14+16&&p.y>=SH()-126-16&&p.y<=SH()-62+16;
function place(id,c,r){
  const dk=DK().filter(x=>x.id!==id),C=gcols(),R=grows();
  c=Math.min(Math.max(c,0),C-1);r=Math.min(Math.max(r,0),R-1);
  const used=(a,b)=>dk.some(x=>x.c===a&&x.r===b);
  if(used(c,r)){let best=null,bd=1e9;for(let a=0;a<C;a++)for(let b=0;b<R;b++)if(!used(a,b)){const d=(a-c)**2+(b-r)**2;if(d<bd){bd=d;best=[a,b]}}if(!best)return;c=best[0];r=best[1]}
  dk.push({id,c,r});S.dk=dk;save();icons()}
